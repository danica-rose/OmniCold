name: OmniCold CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════
  # Smart Contract — Build & Test
  # ═══════════════════════════════════════════════════════════
  contract:
    name: 🦀 Contract Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/omnicold/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/omnicold/Cargo.lock') }}

      - name: Run contract tests
        working-directory: contracts/omnicold
        run: cargo test --verbose

      - name: Build WASM
        working-directory: contracts/omnicold
        run: cargo build --target wasm32-unknown-unknown --release

  # ═══════════════════════════════════════════════════════════
  # Frontend — Lint, Type-check & Test
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: 🌐 Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ═══════════════════════════════════════════════════════════
  # Deploy — Vercel (auto on push to main)
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [contract, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy triggered
        run: echo "✅ All checks passed. Vercel auto-deploys from main branch."
